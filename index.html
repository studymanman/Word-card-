<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>単語帳スキャナー</title>
<style>
  /* ===== 全体の色・余白などをまとめて管理する場所 =====
     色を変えたいときはここの値だけ書き換えればOKです */
  :root{
    --bg: #12151c;
    --panel: #1c212c;
    --accent: #5ec8a8;
    --accent-dark: #3fa285;
    --text: #eef1f5;
    --text-dim: #9aa4b2;
    --danger: #e2685f;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    padding: 16px;
    padding-bottom: 60px;
  }

  h1{
    font-size: 20px;
    margin: 4px 0 2px;
    letter-spacing: 0.02em;
  }
  .sub{
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 16px;
  }

  .panel{
    background: var(--panel);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 16px;
  }

  /* ---- カメラまわり ---- */
  #cameraWrap{
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    background: #000;
    border-radius: var(--radius);
    overflow: hidden;
  }
  #video{
    width:100%;
    height:100%;
    object-fit: cover;
    display:block;
  }

  /* 撮影枠。box-shadowで枠の外側だけ暗くするテクニック */
  #frame{
    position:absolute;
    left:50%; top:50%;
    transform: translate(-50%,-50%);
    border: 2px solid var(--accent);
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.55);
    border-radius: 6px;
    pointer-events:none;
    transition: width .15s, height .15s;
  }
  /* 枠のサイズ4種類。
     大/中/小は「厚み(高さ)」を22%で固定し、横幅だけを変えている
     （サイズ違いで縦にも伸び縮みすると"縦長になった"ように見えてしまうため）。
     極細だけは厚みそのものを薄くした特別な枠。
     数字(%)を変えると枠の大きさを調整できます */
  #frame.size-large { width:96%; height:22%; }
  #frame.size-medium{ width:75%; height:22%; }
  #frame.size-small { width:50%; height:22%; }
  #frame.size-thin  { width:90%; height:10%; } /* 極細：横幅は広いまま厚みだけ薄くする */

  /* 縦向きモード：横向きの width/height をそのまま入れ替えている。
     つまり縦向きでも「厚み(横幅)」は固定で、長さ(高さ)だけが変わる */
  #frame.vertical.size-large { width:22%; height:96%; }
  #frame.vertical.size-medium{ width:22%; height:75%; }
  #frame.vertical.size-small { width:22%; height:50%; }
  #frame.vertical.size-thin  { width:10%; height:90%; }

  #cameraHint{
    position:absolute;
    bottom:10px; left:0; right:0;
    text-align:center;
    color:#fff;
    font-size:12px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    pointer-events:none;
  }

  .row{
    display:flex;
    gap:8px;
    margin-top:10px;
    flex-wrap: wrap;
  }

  button{
    font-family: inherit;
    border:none;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-toggle{
    flex:1;
    background:#2a3140;
    color: var(--text-dim);
  }
  .btn-toggle.active{
    background: var(--accent);
    color:#08251c;
    font-weight:600;
  }

  .btn-main{
    width:100%;
    padding:14px;
    font-size:16px;
    font-weight:700;
    background: var(--accent);
    color:#08251c;
  }
  .btn-main:disabled{
    background:#3a4150;
    color:#6c7684;
  }

  .btn-secondary{
    background:#2a3140;
    color:var(--text);
    flex:1;
  }

  .btn-danger{
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--danger);
  }

  /* ---- サムネイル一覧 ---- */
  #countLabel{
    font-size:14px;
    color: var(--text-dim);
    margin-bottom:8px;
  }
  #countLabel b{ color: var(--text); }

  #thumbs{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap:8px;
  }
  .thumb{
    position:relative;
    background:#000;
    border-radius:8px;
    overflow:hidden;
  }
  .thumb img{
    width:100%;
    display:block;
  }
  .thumb .del{
    position:absolute;
    top:4px; right:4px;
    width:22px; height:22px;
    line-height:22px;
    text-align:center;
    background:rgba(0,0,0,0.6);
    color:#fff;
    border-radius:50%;
    font-size:13px;
    padding:0;
  }
  .empty-note{
    color: var(--text-dim);
    font-size:13px;
    text-align:center;
    padding: 20px 0;
  }

  /* ---- 撮影の合図(音の代わりに画面を一瞬光らせる) ---- */
  #flash{
    position:absolute;
    inset:0;
    background:#fff;
    opacity:0;
    pointer-events:none;
    z-index:8;
  }
  #flash.active{
    animation: flashPulse .28s ease-out;
  }
  @keyframes flashPulse{
    0%   { opacity:0.85; }
    100% { opacity:0; }
  }

  /* 撮影した瞬間、枠の色も一瞬変えて視覚的にわかりやすくする */
  #frame.captured{
    border-color:#fff;
  }
  #zoomControl{
    position:absolute;
    top:6%;
    bottom:6%;
    right:8px;
    width:44px;
    display:flex;
    flex-direction:column;
    align-items:center;
    z-index:5;
  }
  #zoomVal{
    color:#fff;
    font-size:11px;
    background:rgba(0,0,0,0.55);
    padding:2px 7px;
    border-radius:8px;
    margin-bottom:8px;
    pointer-events:none;
    white-space:nowrap;
  }
  /* -webkit-appearance: slider-vertical はSafari/Edge(iOS)系で
     ネイティブに縦スライダーとして描画される。ステップを細かくして
     なめらかに動くようにしている */
  #zoomSlider{
    flex:1;
    width:38px;
    -webkit-appearance: slider-vertical;
    appearance: slider-vertical;
    background: rgba(255,255,255,0.18);
    border-radius:19px;
    outline:none;
  }
  #zoomSlider::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:34px;
    height:34px;
    border-radius:50%;
    background: var(--accent);
    border:2px solid #fff;
    box-shadow:0 1px 5px rgba(0,0,0,0.45);
  }

  select{
    font-family:inherit;
    background:#2a3140;
    color:var(--text);
    border:none;
    border-radius:10px;
    padding:10px;
    font-size:14px;
    flex:1;
  }

  #status{
    font-size:13px;
    color: var(--text-dim);
    min-height: 18px;
    margin-top: 6px;
  }
  #status.error{ color: var(--danger); }

  /* ---- カスタム枠パネル ---- */
  .custom-slider-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
    width:100%;
  }
  .custom-slider-label{
    width:44px;
    font-size:13px;
    color: var(--text-dim);
    flex-shrink:0;
  }
  .custom-slider-row input[type="range"]{
    flex:1;
    accent-color: var(--accent);
  }
  .custom-slider-val{
    width:44px;
    text-align:right;
    font-size:13px;
    color: var(--text);
    flex-shrink:0;
  }

  /* ---- サムネイルの並べ替え用コントロール(↑↓×) ---- */
  .thumb .ctrl-bar{
    position:absolute;
    left:0; right:0; bottom:0;
    display:flex;
    gap:4px;
    padding:4px;
    background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.55));
  }
  .thumb .ctrl-bar button{
    flex:1;
    padding:4px 0;
    font-size:13px;
    background: rgba(0,0,0,0.55);
    color:#fff;
    border-radius:6px;
  }
  .thumb .ctrl-bar button:disabled{
    opacity:0.35;
  }

  /* ---- 一問一答：カメラ枠の上に出す「膜」のプレビュー ----
     #frameの内側に配置し、上下左右それぞれ独立に幅/高さを
     JSから%で指定する。実際の撮影結果には影響しない、あくまで目安表示 */
  .preview-mask{
    position:absolute;
    background: rgba(120,130,150,0.55);
    pointer-events:none;
    display:none; /* 一問一答モードOFFのときは非表示 */
  }
  #previewMaskTop   { top:0; left:0; right:0; }
  #previewMaskBottom{ bottom:0; left:0; right:0; }
  #previewMaskLeft  { top:0; bottom:0; left:0; }
  #previewMaskRight { top:0; bottom:0; right:0; }

  /* ---- マスクの境界線をタップ&ドラッグして伸び縮みさせるハンドル ----
     見た目は小さな白いつまみ。指で掴みやすいよう、実際の見た目より
     少し広めのタップ範囲(padding)を確保している。
     touch-action:none で、ドラッグ中にページ全体がスクロールしてしまうのを防ぐ */
  .mask-handle{
    position:absolute;
    background:#fff;
    border-radius:6px;
    box-shadow:0 1px 4px rgba(0,0,0,0.5);
    touch-action:none;
    z-index:6;
    /* 親の#frameがpointer-events:noneなので、ここで明示的に
       操作を受け付けるように戻しておかないと、表示されても
       指でつかめない(反応しない)状態になってしまう */
    pointer-events:auto;
  }
  #maskHandleTop, #maskHandleBottom{
    left:50%;
    width:44px; height:16px;
    transform:translate(-50%,-50%);
  }
  #maskHandleLeft, #maskHandleRight{
    top:50%;
    width:16px; height:44px;
    transform:translate(-50%,-50%);
  }

  /* ---- 一問一答：練習画面(全画面表示) ----
     通常のページの上に覆いかぶさる形で表示する、独立した「練習用の画面」。
     閉じるまでは他のパネルは見えなくなる */
  #qaViewer{
    display:none;
    position:fixed;
    inset:0;
    background:var(--bg);
    z-index:50;
    padding:16px;
    padding-bottom:40px;
    overflow-y:auto;
  }
  #qaCardWrap{
    position:relative;
    width:100%;
    background:#000;
    border-radius: var(--radius);
    overflow:hidden;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #qaCardImg{
    width:100%;
    display:block;
  }
  .qa-mask{
    position:absolute;
    background: var(--panel);
    border: 1px dashed var(--text-dim);
    box-sizing:border-box;
    display:none;
  }
  #qaMaskTop   { top:0; left:0; right:0; }
  #qaMaskBottom{ bottom:0; left:0; right:0; }
  #qaMaskLeft  { top:0; bottom:0; left:0; }
  #qaMaskRight { top:0; bottom:0; right:0; }
</style>
</head>
<body>

<h1>単語帳スキャナー</h1>
<div class="sub">枠の中を撮ってたまったらPDFにまとめます（枚数の上限はありません）</div>

<div class="panel">
  <div id="cameraWrap">
    <video id="video" autoplay playsinline muted></video>
    <div id="frame" class="size-medium">
      <div id="previewMaskTop" class="preview-mask"></div>
      <div id="previewMaskBottom" class="preview-mask"></div>
      <div id="previewMaskLeft" class="preview-mask"></div>
      <div id="previewMaskRight" class="preview-mask"></div>
      <div id="maskHandleTop" class="mask-handle" style="display:none;"></div>
      <div id="maskHandleBottom" class="mask-handle" style="display:none;"></div>
      <div id="maskHandleLeft" class="mask-handle" style="display:none;"></div>
      <div id="maskHandleRight" class="mask-handle" style="display:none;"></div>
    </div>
    <div id="flash"></div>
    <div id="zoomControl">
      <span id="zoomVal">1.0x</span>
      <input type="range" id="zoomSlider" min="1" max="3" step="0.02" value="1" orient="vertical">
    </div>
    <div id="cameraHint">枠の中に単語を収めてください</div>
  </div>

  <div class="row">
    <button class="btn-toggle" data-size="large">大</button>
    <button class="btn-toggle active" data-size="medium">中</button>
    <button class="btn-toggle" data-size="small">小</button>
    <button class="btn-toggle" data-size="thin">極細</button>
    <button class="btn-toggle" data-size="custom">カスタム</button>
  </div>

  <div class="row" id="orientRow">
    <button class="btn-toggle active" data-orient="horizontal">横向きの枠</button>
    <button class="btn-toggle" data-orient="vertical">縦向きの枠</button>
  </div>

  <!-- 「カスタム」を選んだときだけ表示される、枠のサイズを自分で
       調節するためのパネル。スライダーで横幅・縦幅を直接指定できる。
       普段は非表示(display:none)にしておく -->
  <div class="row" id="customPanel" style="display:none; flex-direction:column;">
    <div class="custom-slider-row">
      <span class="custom-slider-label">横幅</span>
      <input type="range" id="customWidth" min="5" max="100" step="1" value="75">
      <span class="custom-slider-val" id="customWidthVal">75%</span>
    </div>
    <div class="custom-slider-row">
      <span class="custom-slider-label">縦幅</span>
      <input type="range" id="customHeight" min="5" max="100" step="1" value="22">
      <span class="custom-slider-val" id="customHeightVal">22%</span>
    </div>
    <div class="row" style="margin-top:4px;">
      <select id="templateSelect"><option value="">（保存したテンプレートなし）</option></select>
    </div>
    <div class="row">
      <button id="applyTemplateBtn" class="btn-secondary">テンプレートを適用</button>
      <button id="deleteTemplateBtn" class="btn-danger">削除</button>
    </div>
    <div class="row">
      <button id="saveTemplateBtn" class="btn-secondary" style="flex:1">今のカスタム枠をテンプレートとして保存</button>
    </div>
  </div>

  <div class="row">
    <button id="startBtn" class="btn-secondary">カメラを起動</button>
    <button id="flipBtn" class="btn-secondary">カメラ切替</button>
  </div>

  <div class="row">
    <button id="shootBtn" class="btn-main" disabled>撮影する</button>
  </div>

  <div id="status"></div>
</div>

<div class="panel">
  <div id="countLabel">撮影済み：<b id="countNum">0</b>枚</div>
  <div class="row">
    <button id="shuffleBtn" class="btn-secondary" style="flex:1">並び順をランダムにする</button>
  </div>
  <div id="thumbs"></div>
  <div id="emptyNote" class="empty-note">まだ撮影した単語がありません</div>
</div>

<div class="panel">
  <div class="row">
    <select id="pageSize">
      <option value="a4">A4で作る</option>
      <option value="a5">A5で作る</option>
    </select>
  </div>
  <!-- 列数を1〜8列の間で自由に選べるステッパー。
       ボタンで±1ずつ変えられるので、数字入力が苦手でも操作しやすい -->
  <div class="row" style="align-items:center;">
    <span class="custom-slider-label" style="width:auto;">列数</span>
    <button id="colsMinus" class="btn-secondary" style="flex:0 0 44px;">－</button>
    <input type="number" id="layoutCols" min="1" max="8" value="2" readonly
           style="width:56px; text-align:center; background:#2a3140; color:var(--text); border:none; border-radius:10px; font-size:15px; padding:8px 0;">
    <button id="colsPlus" class="btn-secondary" style="flex:0 0 44px;">＋</button>
    <span class="custom-slider-label" style="width:auto; color:var(--text-dim);">列（多いほど1枚に詰まります）</span>
  </div>
  <div class="row">
    <button id="pdfBtn" class="btn-main" disabled>PDFを作成してダウンロード</button>
  </div>
  <div class="row">
    <button id="resetBtn" class="btn-danger" style="flex:1">全部消してやり直す</button>
  </div>
</div>

<!-- ===== 一問一答（フラッシュカード）機能 =====
     PDFにはせず、専用の「練習画面」を別に開いて使う機能。
     隠す範囲(上下左右)は、下のスライダーではなく、カメラ枠の
     ふち(境界線)を直接タップ＆ドラッグして伸び縮みさせる方式にした -->
<div class="panel">
  <div class="row">
    <button id="qaToggleBtn" class="btn-toggle" style="flex:1">一問一答モード（隠す範囲の編集）を有効にする</button>
  </div>
  <div id="maskHint" class="sub" style="display:none; margin:6px 0 0;">
    カメラ枠のふちに出た白いつまみを指でつかんでドラッグすると、隠す範囲(グレーの膜)を伸び縮みできます。
  </div>
</div>

<!-- ===== 一問一答セット(名前をつけて保存) =====
     今撮っている写真をひとまとまりの「セット」として名前をつけて保存し、
     あとから選んで練習できるようにする機能。ブラウザの中(localStorage)に
     保存されるので、同じNetlifyのURLで開いたときだけ復元できる -->
<div class="panel">
  <div class="row">
    <button id="qaViewBtn" class="btn-main" disabled>今の写真で練習する（保存せずに）</button>
  </div>
  <div class="row">
    <button id="saveDeckBtn" class="btn-secondary" style="flex:1" disabled>今の写真を名前をつけてセットに保存</button>
  </div>
  <div class="row">
    <select id="deckSelect"><option value="">（保存したセットなし）</option></select>
  </div>
  <div class="row">
    <button id="practiceDeckBtn" class="btn-main" disabled>このセットで練習する</button>
    <button id="deleteDeckBtn" class="btn-danger" disabled>削除</button>
  </div>
</div>

<!-- ===== 一問一答：練習画面(全画面) =====
     開いている間は他のパネルの上に覆いかぶさって表示される、
     独立した練習用の画面。画像をタップすると隠した部分の
     表示/非表示が切り替わり、前へ/次へで別のカードに移動する -->
<div id="qaViewer">
  <h1 id="qaDeckTitle" style="margin-bottom:2px;">一問一答</h1>
  <div id="qaCountLabel" style="margin-bottom:12px; font-size:14px; color: var(--text-dim);">
    カード <b id="qaIndexNum" style="color:var(--text);">1</b> / <span id="qaTotalNum">1</span>
  </div>
  <div id="qaCardWrap">
    <img id="qaCardImg" src="" alt="カード">
    <div id="qaMaskTop" class="qa-mask"></div>
    <div id="qaMaskBottom" class="qa-mask"></div>
    <div id="qaMaskLeft" class="qa-mask"></div>
    <div id="qaMaskRight" class="qa-mask"></div>
  </div>
  <div class="sub" style="text-align:center; margin-top:6px;">カードをタップすると隠れている部分が見えます</div>
  <div class="row">
    <button id="qaPrevBtn" class="btn-secondary" style="flex:1">← 前へ</button>
    <button id="qaNextBtn" class="btn-secondary" style="flex:1">次へ →</button>
  </div>
  <div class="row">
    <button id="qaCloseBtn" class="btn-danger" style="flex:1">閉じる</button>
  </div>
</div>

<!-- PDF作成に使うライブラリは、JS側で複数の読み込み元を
     順番に試すようにしています(下のscript内のensureJsPDF)。
     どこか1つが繋がらなくても他で読み込めるためです。 -->

<script>
/* =========================================================
   単語帳スキャナー本体のスクリプト
   非エンジニアの方でも追いやすいように、なるべく処理ごとに
   コメントを書いています。
   ========================================================= */

/* ---------- PDFライブラリ(jsPDF)の読み込み ----------
   1箇所のCDNだけに頼ると、そこに繋がらないときにPDFが
   作れなくなってしまうため、複数の読み込み元を順番に試す。
   ページを開いた時点でバックグラウンドで読み込みを始めておき、
   「PDFを作成」ボタンを押した瞬間には読み込み済みの状態を
   目指す（ボタンを押した後にawaitで待つと、iOS Safariで
   ダウンロードがブロックされることがあるため）。
*/
function loadScriptOnce(src){
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = src;
    s.onload = ()=> resolve();
    s.onerror = ()=> reject(new Error('読み込み失敗: ' + src));
    document.head.appendChild(s);
  });
}

async function ensureJsPDF(){
  if(window.jspdf && window.jspdf.jsPDF) return true;
  const candidates = [
    'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
    'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',
    'https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js'
  ];
  for(const url of candidates){
    try{
      await loadScriptOnce(url);
      if(window.jspdf && window.jspdf.jsPDF) return true;
    }catch(e){
      console.warn(e);
    }
  }
  return false;
}

// ページを開いたらすぐ先読みしておく
ensureJsPDF();

/* ---------- 枠のサイズ切り替え(大/中/小/極細/カスタム) ----------
   「カスタム」を選んだときだけ、下にスライダーのパネルを表示して
   横幅・縦幅を自分で自由に決められるようにしている。
   その場合は「向き(横/縦)」ボタンの意味がなくなるので非表示にする
   （カスタムでは横幅・縦幅を両方直接指定できるため、縦長も横長も
   スライダーだけで作れる） */
document.querySelectorAll('.btn-toggle[data-size]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.btn-toggle[data-size]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');

    if(btn.dataset.size === 'custom'){
      orientRow.style.display = 'none';
      customPanel.style.display = 'flex';
      frameEl.className = 'size-custom';
      applyCustomFrameSize();
    }else{
      orientRow.style.display = '';
      customPanel.style.display = 'none';
      // カスタムで直接指定していたinlineのwidth/heightを解除して、
      // CSSのクラス指定(size-large等)が効くようにする
      frameEl.style.width = '';
      frameEl.style.height = '';
      // vertical(縦向き)のクラスは維持したまま、サイズのクラスだけ入れ替える
      const isVertical = frameEl.classList.contains('vertical');
      frameEl.className = 'size-' + btn.dataset.size + (isVertical ? ' vertical' : '');
    }
  });
});

/* ---------- テンプレート機能 ----------
   カスタム枠の「横幅・縦幅」の組み合わせに名前を付けて、

   ※ iPadのEdge/Safariなど、同じブラウザ・同じサイト(同じURL)で
   開いたときだけ読み込める点に注意（別の端末やアプリには
   引き継がれません）
*/
const TEMPLATE_KEY = 'wordFrameTemplates';

function loadTemplates(){
  try{
    return JSON.parse(localStorage.getItem(TEMPLATE_KEY)) || [];
  }catch(e){
    return [];
  }
}

function saveTemplatesToStorage(list){
  localStorage.setItem(TEMPLATE_KEY, JSON.stringify(list));
}

function refreshTemplateSelect(){
  const list = loadTemplates();
  templateSelect.innerHTML = '';
  if(list.length === 0){
    const opt = document.createElement('option');
    opt.value = '';
    opt.textContent = '（保存したテンプレートなし）';
    templateSelect.appendChild(opt);
    return;
  }
  list.forEach(t=>{
    const opt = document.createElement('option');
    opt.value = t.name;
    opt.textContent = t.name + '（横' + t.width + '% / 縦' + t.height + '%）';
    templateSelect.appendChild(opt);
  });
}

    height: parseInt(customHeightSlider.value, 10)

/* ---------- 一問一答：隠す範囲(マスク)機能 ----------
   ONにすると、カメラ枠のふちに白いつまみが出てくる。
   それを指でつかんでドラッグすると、隠す範囲(半透明の膜)を
   上下左右それぞれ自由に伸び縮みできる。
   ここで決めた割合は、「今の写真で練習する」やセット保存時に使われる。
*/
function loadQaSettings(){
  try{
    const saved = JSON.parse(localStorage.getItem(QA_SETTINGS_KEY));
    if(saved){
      maskTop = saved.top ?? 0;
      maskBottom = saved.bottom ?? 0;
      maskLeft = saved.left ?? 0;
      maskRight = saved.right ?? 50;
    }
  }catch(e){ /* 保存データがなければ初期値のまま */ }
  updateMaskDisplays();
}

function saveQaSettings(){
  localStorage.setItem(QA_SETTINGS_KEY, JSON.stringify({
    top: maskTop, bottom: maskBottom, left: maskLeft, right: maskRight
  }));
}

// マスクの数値を、カメラ枠上の膜(previewMask)とつまみ(handle)の
// 位置・大きさの両方に反映する
function updateMaskDisplays(){
  previewMaskTop.style.height = maskTop + '%';
  previewMaskBottom.style.height = maskBottom + '%';
  previewMaskLeft.style.width = maskLeft + '%';
  previewMaskRight.style.width = maskRight + '%';

  maskHandleTop.style.top = maskTop + '%';
  maskHandleBottom.style.top = (100 - maskBottom) + '%';
  maskHandleLeft.style.left = maskLeft + '%';
  maskHandleRight.style.left = (100 - maskRight) + '%';
}

/* ---------- つまみをドラッグして数値を変える共通処理 ----------
   axis: 'x'か'y'。ドラッグする向き(横方向か縦方向か)
   invert: trueなら「ドラッグする向きと増減の向きが逆」(下/右の膜用)
   setter: ドラッグ中の新しい値(0〜90)を受け取って反映する関数
   getter: 現在の値を返す関数
*/
function makeMaskHandleDraggable(handleEl, axis, invert, getter, setter){
  handleEl.addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    handleEl.setPointerCapture(e.pointerId);
    const frameRect = frameEl.getBoundingClientRect();
    const sizePx = axis === 'y' ? frameRect.height : frameRect.width;
    const startPos = axis === 'y' ? e.clientY : e.clientX;
    const startVal = getter();

    function onMove(ev){
      const curPos = axis === 'y' ? ev.clientY : ev.clientX;
      let deltaPct = ((curPos - startPos) / sizePx) * 100;
      if(invert) deltaPct = -deltaPct;
      const newVal = Math.round(Math.max(0, Math.min(90, startVal + deltaPct)));
      setter(newVal);
      updateMaskDisplays();
    }
    function onUp(){
      handleEl.removeEventListener('pointermove', onMove);
      handleEl.removeEventListener('pointerup', onUp);
      saveQaSettings();
    }
    handleEl.addEventListener('pointermove', onMove);
    handleEl.addEventListener('pointerup', onUp);
  });
}

makeMaskHandleDraggable(maskHandleTop,    'y', false, ()=>maskTop,    v=>maskTop=v);
makeMaskHandleDraggable(maskHandleBottom, 'y', true,  ()=>maskBottom, v=>maskBottom=v);
makeMaskHandleDraggable(maskHandleLeft,   'x', false, ()=>maskLeft,   v=>maskLeft=v);
makeMaskHandleDraggable(maskHandleRight,  'x', true,  ()=>maskRight,  v=>maskRight=v);

qaToggleBtn.addEventListener('click', ()=>{
  qaEnabled = !qaEnabled;
  qaToggleBtn.classList.toggle('active', qaEnabled);

  const list = loadDecks();
  const newDeck = {
    name: name,
    shots: shots.map(s => ({ dataUrl:s.dataUrl, width:s.width, height:s.height })),
    mask: { top:maskTop, bottom:maskBottom, left:maskLeft, right:maskRight }

  if(existingIdx >= 0){
    list[existingIdx] = newDeck;
  }else{
    list.push(newDeck);
  }
  try{
    saveDecksToStorage(list);
    refreshDeckSelect();
    deckSelect.value = name;
    setStatus('セット「' + name + '」を保存しました');
  }catch(e){
    setStatus('保存に失敗しました。写真の枚数を減らすか、不要なセットを削除してから試してください。', true);

/* ---------- 一問一答：練習画面(全画面) ----------
   name/shots/maskを指定しないで呼ぶと「今の写真」で練習する。
   セットを指定した場合はそのセットの内容で練習する */
function openQaViewer(name, practiceShots, mask){
  const list = practiceShots || shots;
  if(list.length === 0) return;
  qaPractice = {
    name: name || '',
    shots: list,
    mask: mask || { top:maskTop, bottom:maskBottom, left:maskLeft, right:maskRight }
  };
  qaDeckTitle.textContent = qaPractice.name ? ('一問一答：' + qaPractice.name) : '一問一答：今の写真';
  qaIndex = 0;
  qaViewer.style.display = 'block';
  renderQaCard();
}

function renderQaCard(){
  const shot = qaPractice.shots[qaIndex];
  qaCardImg.src = shot.dataUrl;
  qaIndexNum.textContent = qaIndex + 1;
  qaTotalNum.textContent = qaPractice.shots.length;
  qaRevealed = false;
  applyQaMaskVisibility();
}

// 隠す範囲(qaMaskTop等)の大きさをセットの設定に合わせて、表示/非表示を切り替える
function applyQaMaskVisibility(){
  const m = qaPractice.mask;
  [qaMaskTop, qaMaskBottom, qaMaskLeft, qaMaskRight].forEach(el=>{
    el.style.display = qaRevealed ? 'none' : 'block';
  });
  qaMaskTop.style.height = m.top + '%';
  qaMaskBottom.style.height = m.bottom + '%';
  qaMaskLeft.style.width = m.left + '%';
  qaMaskRight.style.width = m.right + '%';
}

qaCardWrap.addEventListener('click', ()=>{

  applyQaMaskVisibility();
});

qaPrevBtn.addEventListener('click', ()=>{
  qaIndex = (qaIndex - 1 + qaPractice.shots.length) % qaPractice.shots.length;
  renderQaCard();
});
qaNextBtn.addEventListener('click', ()=>{

/* ---------- カメラ起動 ---------- */
async function startCamera(){
  setStatus('カメラを起動しています…');
  // すでに映像が出ていたら一旦止める(カメラ切替のときのため)
  if(currentStream){
    currentStream.getTracks().forEach(t=>t.stop());
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode: { ideal: facingMode },
        width:  { ideal: 1920 },
        height: { ideal: 1080 }
      }
    });
    currentStream = stream;
    currentTrack = stream.getVideoTracks()[0];
    video.srcObject = stream;
    shootBtn.disabled = false;
    setupZoom();
    setStatus('');
  }catch(err){
    console.error(err);
    setStatus('カメラを起動できませんでした。ブラウザのカメラ許可設定を確認してください。', true);
  }
}

/* ---------- ズームの準備 ----------
   端末・ブラウザが「ハードウェアズーム」に対応していればそれを使う。
   対応していない場合（iPadのSafariなど多くはこちら）は、
   映像そのものをCSSで拡大表示する「疑似ズーム」に切り替える。
   ※撮影の切り取り計算は画面上の実際の見た目のサイズを元に
     行っているので、どちらの方式でも撮影結果は正しく切り取られる。
*/
function setupZoom(){
  video.style.transform = 'scale(1)'; // 前回の拡大表示をリセット
  zoomSlider.value = 1;
  zoomValEl.textContent = '1.0x';

  const caps = currentTrack.getCapabilities ? currentTrack.getCapabilities() : {};
  if(caps.zoom){
    zoomMode = 'hardware';
    zoomSlider.min = caps.zoom.min;
    zoomSlider.max = caps.zoom.max;
    zoomSlider.step = caps.zoom.step || 0.1;
    zoomSlider.value = caps.zoom.min;
  }else{
    zoomMode = 'css';
    zoomSlider.min = 1;
    zoomSlider.max = 3;
    zoomSlider.step = 0.02;
    zoomSlider.value = 1;
  }
}

zoomSlider.addEventListener('input', ()=>{
  const val = parseFloat(zoomSlider.value);
  zoomValEl.textContent = val.toFixed(1) + 'x';

  if(zoomMode === 'hardware'){
    currentTrack.applyConstraints({ advanced: [{ zoom: val }] }).catch(err=>{
      console.error(err);
      setStatus('ズームの適用に失敗しました', true);
    });
  }else{
    // 映像自体を拡大する疑似ズーム(中心を基準に拡大)
    video.style.transform = 'scale(' + val + ')';
  }
});

startBtn.addEventListener('click', startCamera);

flipBtn.addEventListener('click', ()=>{
  facingMode = (facingMode === 'environment') ? 'user' : 'environment';
  startCamera();
});

/* ---------- 撮影処理 ----------
   ポイント：ネイティブのカメラ機能(input capture等)を使わず、
   映像(video)から直接canvasに描き写しているだけなので
   シャッター音は鳴りません。
*/
shootBtn.addEventListener('click', ()=>{
  if(!video.videoWidth){
    setStatus('カメラの準備がまだできていません。少し待ってから押してください。', true);
    return;
  }

  // 1) 画面上の「枠」と「映像」の位置・大きさ(px)を取得
  const videoRect = video.getBoundingClientRect();
  const frameRect = frameEl.getBoundingClientRect();

  // 2) video要素はCSSで object-fit:cover にしているため、
  //    実際の映像(videoWidth x videoHeight)は画面表示より
  //    拡大されて中央が切り取られた状態で見えている。
  //    その拡大率(scale)とズレ(offset)を計算する。
  const scale = Math.max(
    videoRect.width  / video.videoWidth,
    videoRect.height / video.videoHeight
  );
  const renderedW = video.videoWidth  * scale;
  const renderedH = video.videoHeight * scale;
  const offsetX = (renderedW - videoRect.width)  / 2;
  const offsetY = (renderedH - videoRect.height) / 2;

  // 3) 画面上の枠の位置を「実際の映像の中の座標(px)」に変換
  const frameLeftOnVideo = (frameRect.left - videoRect.left) + offsetX;
  const frameTopOnVideo  = (frameRect.top  - videoRect.top)  + offsetY;

  const srcX = frameLeftOnVideo / scale;
  const srcY = frameTopOnVideo  / scale;
  const srcW = frameRect.width  / scale;
  const srcH = frameRect.height / scale;

  // 4) その部分だけをcanvasに切り取って描画
  const canvas = document.createElement('canvas');
  canvas.width  = Math.round(srcW);
  canvas.height = Math.round(srcH);
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, srcX, srcY, srcW, srcH, 0, 0, canvas.width, canvas.height);

  const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
  // PDF作成時に読み直さなくていいよう、幅と高さもこの時点で保存しておく
  shots.push({ dataUrl: dataUrl, width: canvas.width, height: canvas.height });
  renderThumbs();
  showCaptureSignal();
  setStatus('撮影しました（合計' + shots.length + '枚）');
});

/* ---------- 撮れたことを知らせる合図 ----------
   音を鳴らさない方針なので、代わりに
   ・画面を一瞬白く光らせる
   ・枠を一瞬白くする
   ・対応端末なら軽く振動させる(navigator.vibrate。音ではないのでシャッター音の
     方針とは矛盾しない。対応していない端末では単に何も起きないだけ)
   の3つで「撮れたこと」がわかるようにしている。
*/
function showCaptureSignal(){
  // クラスを一度外してから付け直すことで、連続撮影時にもアニメーションを
  // 毎回最初から再生できるようにしている
  flashEl.classList.remove('active');
  frameEl.classList.remove('captured');
  void flashEl.offsetWidth; // 強制的に再描画させるおまじない
  flashEl.classList.add('active');
  frameEl.classList.add('captured');

  setTimeout(()=>{
    frameEl.classList.remove('captured');
  }, 280);

  if(navigator.vibrate){
    navigator.vibrate(60);
  }
}

/* ---------- サムネイル表示 ---------- */
function renderThumbs(){
  thumbsEl.innerHTML = '';
  emptyNoteEl.style.display = shots.length ? 'none' : 'block';

  shots.forEach((shot, idx)=>{
    const box = document.createElement('div');
    box.className = 'thumb';

    const img = document.createElement('img');
    img.src = shot.dataUrl;
    box.appendChild(img);

    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '×';
    del.addEventListener('click', ()=>{
      shots.splice(idx,1);
      renderThumbs();
    });
    box.appendChild(del);

    // ---- 並べ替え用の「↑」「↓」ボタン ----
    // 押すと、配列shotsの中で自分の位置を1つ前/後ろの画像と入れ替える。
    // 一番上の画像には↑、一番下の画像には↓を無効(disabled)にしている
    const ctrlBar = document.createElement('div');
    ctrlBar.className = 'ctrl-bar';

    const upBtn = document.createElement('button');
    upBtn.textContent = '↑';
    upBtn.disabled = (idx === 0);
    upBtn.addEventListener('click', ()=>{
      if(idx === 0) return;
      [shots[idx-1], shots[idx]] = [shots[idx], shots[idx-1]];
      renderThumbs();
    });
    ctrlBar.appendChild(upBtn);

    const downBtn = document.createElement('button');
    downBtn.textContent = '↓';
    downBtn.disabled = (idx === shots.length - 1);
    downBtn.addEventListener('click', ()=>{
      if(idx === shots.length - 1) return;
      [shots[idx+1], shots[idx]] = [shots[idx], shots[idx+1]];
      renderThumbs();
    });
    ctrlBar.appendChild(downBtn);

    box.appendChild(ctrlBar);

    thumbsEl.appendChild(box);
  });

  countNumEl.textContent = shots.length;
  shootBtn.disabled = !currentStream; // 撮影枚数の上限は撤廃したので、カメラが起動していれば撮影可能
  pdfBtn.disabled = shots.length === 0;
  qaViewBtn.disabled = shots.length === 0;
  saveDeckBtn.disabled = shots.length === 0;
  // 練習画面が「今の写真」を見ている最中(＝保存済みセットではない)場合だけ、
  // 撮影し直して枚数が変わったことを画面にも反映する
  if(qaViewer.style.display === 'block' && qaPractice.shots === shots){
    if(shots.length === 0){
      qaViewer.style.display = 'none';
    }else{
      if(qaIndex >= shots.length) qaIndex = shots.length - 1;
      renderQaCard();
    }
  }
}

/* ---------- 並び順をランダムにする ----------
   Fisher-Yatesシャッフルという定番のやり方で、配列の中身を
   偏りなくランダムに並べ替えている */
shuffleBtn.addEventListener('click', ()=>{
  if(shots.length < 2) return;
  for(let i = shots.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [shots[i], shots[j]] = [shots[j], shots[i]];
  }
  renderThumbs();
  setStatus('並び順をランダムにしました');
});

/* ---------- 全部リセット ---------- */
resetBtn.addEventListener('click', ()=>{
  if(shots.length === 0) return;
  if(confirm('撮影した' + shots.length + '枚をすべて削除します。よろしいですか？')){
    shots = [];
    renderThumbs();
    setStatus('リセットしました');
  }
});

/* ---------- PDF作成 ----------
   単語カードを、ページの上から下へ順番に並べていきます。
   入りきらなくなったら自動で次のページに移ります。
   列数(1〜8)は「列数」のステッパーで自由に選べます。
*/
function buildAndDownloadPdf(filename){
  if(shots.length === 0) return false;

  if(!(window.jspdf && window.jspdf.jsPDF)){
    setStatus('PDF機能の読み込みに失敗しました。電波の良い場所でもう一度ボタンを押してみてください。', true);
    ensureJsPDF();
    return false;
  }

  try{
    const { jsPDF } = window.jspdf;
    const size = pageSizeSel.value; // 'a4' or 'a5'
    const doc = new jsPDF({
      orientation: 'portrait',
      unit: 'mm',
      format: size
    });

    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const margin = 4;         // 外側の余白(mm)。より詰めて1枚に多く入るようにしている
    const gap = 1.5;          // 縦方向のカード同士の間隔(mm)
    const columnGap = 1.5;    // 列と列の間隔(mm)
    const columns = Math.max(1, Math.min(8, parseInt(layoutColsSel.value, 10) || 1));

    const usableW = pageW - margin*2;
    const colW = (usableW - columnGap*(columns-1)) / columns;

    let cursorY = margin;

    // shotsをcolumns個ずつの「行」に分けて、行ごとに高さをそろえて並べる
    for(let i=0; i<shots.length; i += columns){
      const rowItems = shots.slice(i, i + columns);
      const rowHeights = rowItems.map(s => colW * (s.height / s.width));
      const rowH = Math.max(...rowHeights);

      // ページに入りきらなければ新しいページへ
      if(cursorY + rowH > pageH - margin){
        doc.addPage();
        cursorY = margin;
      }

      rowItems.forEach((shot, idx)=>{
        const x = margin + idx * (colW + columnGap);
        const h = colW * (shot.height / shot.width);
        doc.addImage(shot.dataUrl, 'JPEG', x, cursorY, colW, h);
      });

      cursorY += rowH + gap;
    }

    doc.save(filename);
    return true;
  }catch(err){
    console.error(err);
    setStatus('PDFの作成に失敗しました：' + err.message, true);
    return false;
  }
}

pdfBtn.addEventListener('click', ()=>{
  // 前に途中まで動いて固まっていた原因：処理の途中でawait(非同期の待ち)が
  // 入っていたため、iOSのSafariが「ボタンを押した操作の続き」とみなさなくなり、
  // 最後のダウンロードがブロックされていた可能性が高い。
  // → 画像のサイズは撮影時に保存済みなので、ここでは一切待たずに
  //    全部その場で(同期処理で)完結させる。
  pdfBtn.disabled = true;
  setStatus('PDFを作成しています…');
  const ok = buildAndDownloadPdf('単語帳.pdf');
  if(ok) setStatus('PDFをダウンロードしました');
  // 失敗した場合のエラーメッセージはbuildAndDownloadPdfの中で
  // すでに表示済みなので、ここで上書きしない
  pdfBtn.disabled = false;
});

/* 初期状態の見た目を整える */
renderThumbs();
</script>
