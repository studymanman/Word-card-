<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>単語帳スキャナー</title>
<style>
  /* ===== 全体の色・余白などをまとめて管理する場所 =====
     色を変えたいときはここの値だけ書き換えればOKです */
  :root{
    --bg: #12151c;
    --panel: #1c212c;
    --accent: #5ec8a8;
    --accent-dark: #3fa285;
    --text: #eef1f5;
    --text-dim: #9aa4b2;
    --danger: #e2685f;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    padding: 16px;
    padding-bottom: 60px;
  }

  h1{
    font-size: 20px;
    margin: 4px 0 2px;
    letter-spacing: 0.02em;
  }
  .sub{
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 16px;
  }

  .panel{
    background: var(--panel);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 16px;
  }

  /* ---- カメラまわり ---- */
  #cameraWrap{
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    background: #000;
    border-radius: var(--radius);
    overflow: hidden;
  }
  #video{
    width:100%;
    height:100%;
    object-fit: cover;
    display:block;
  }

  /* 撮影枠。box-shadowで枠の外側だけ暗くするテクニック */
  #frame{
    position:absolute;
    left:50%; top:50%;
    transform: translate(-50%,-50%);
    border: 2px solid var(--accent);
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.55);
    border-radius: 6px;
    pointer-events:none;
    transition: width .15s, height .15s;
  }
  /* 枠のサイズ4種類。
     大/中/小は「厚み(高さ)」を22%で固定し、横幅だけを変えている
     （サイズ違いで縦にも伸び縮みすると"縦長になった"ように見えてしまうため）。
     極細だけは厚みそのものを薄くした特別な枠。
     数字(%)を変えると枠の大きさを調整できます */
  #frame.size-large { width:96%; height:22%; }
  #frame.size-medium{ width:75%; height:22%; }
  #frame.size-small { width:50%; height:22%; }
  #frame.size-thin  { width:90%; height:10%; } /* 極細：横幅は広いまま厚みだけ薄くする */

  /* 縦向きモード：横向きの width/height をそのまま入れ替えている。
     つまり縦向きでも「厚み(横幅)」は固定で、長さ(高さ)だけが変わる */
  #frame.vertical.size-large { width:22%; height:96%; }
  #frame.vertical.size-medium{ width:22%; height:75%; }
  #frame.vertical.size-small { width:22%; height:50%; }
  #frame.vertical.size-thin  { width:10%; height:90%; }

  #cameraHint{
    position:absolute;
    bottom:10px; left:0; right:0;
    text-align:center;
    color:#fff;
    font-size:12px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    pointer-events:none;
  }

  .row{
    display:flex;
    gap:8px;
    margin-top:10px;
    flex-wrap: wrap;
  }

  button{
    font-family: inherit;
    border:none;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-toggle{
    flex:1;
    background:#2a3140;
    color: var(--text-dim);
  }
  .btn-toggle.active{
    background: var(--accent);
    color:#08251c;
    font-weight:600;
  }

  .btn-main{
    width:100%;
    padding:14px;
    font-size:16px;
    font-weight:700;
    background: var(--accent);
    color:#08251c;
  }
  .btn-main:disabled{
    background:#3a4150;
    color:#6c7684;
  }

  .btn-secondary{
    background:#2a3140;
    color:var(--text);
    flex:1;
  }

  .btn-danger{
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--danger);
  }

  /* ---- サムネイル一覧 ---- */
  #countLabel{
    font-size:14px;
    color: var(--text-dim);
    margin-bottom:8px;
  }
  #countLabel b{ color: var(--text); }

  #thumbs{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap:8px;
  }
  .thumb{
    position:relative;
    background:#000;
    border-radius:8px;
    overflow:hidden;
  }
  .thumb img{
    width:100%;
    display:block;
  }
  .thumb .del{
    position:absolute;
    top:4px; right:4px;
    width:22px; height:22px;
    line-height:22px;
    text-align:center;
    background:rgba(0,0,0,0.6);
    color:#fff;
    border-radius:50%;
    font-size:13px;
    padding:0;
  }
  .empty-note{
    color: var(--text-dim);
    font-size:13px;
    text-align:center;
    padding: 20px 0;
  }

  /* ---- 撮影の合図(音の代わりに画面を一瞬光らせる) ---- */
  #flash{
    position:absolute;
    inset:0;
    background:#fff;
    opacity:0;
    pointer-events:none;
    z-index:8;
  }
  #flash.active{
    animation: flashPulse .28s ease-out;
  }
  @keyframes flashPulse{
    0%   { opacity:0.85; }
    100% { opacity:0; }
  }

  /* 撮影した瞬間、枠の色も一瞬変えて視覚的にわかりやすくする */
  #frame.captured{
    border-color:#fff;
  }
  #zoomControl{
    position:absolute;
    top:6%;
    bottom:6%;
    right:8px;
    width:44px;
    display:flex;
    flex-direction:column;
    align-items:center;
    z-index:5;
  }
  #zoomVal{
    color:#fff;
    font-size:11px;
    background:rgba(0,0,0,0.55);
    padding:2px 7px;
    border-radius:8px;
    margin-bottom:8px;
    pointer-events:none;
    white-space:nowrap;
  }
  /* -webkit-appearance: slider-vertical はSafari/Edge(iOS)系で
     ネイティブに縦スライダーとして描画される。ステップを細かくして
     なめらかに動くようにしている */
  #zoomSlider{
    flex:1;
    width:38px;
    -webkit-appearance: slider-vertical;
    appearance: slider-vertical;
    background: rgba(255,255,255,0.18);
    border-radius:19px;
    outline:none;
  }
  #zoomSlider::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:34px;
    height:34px;
    border-radius:50%;
    background: var(--accent);
    border:2px solid #fff;
    box-shadow:0 1px 5px rgba(0,0,0,0.45);
  }

  select{
    font-family:inherit;
    background:#2a3140;
    color:var(--text);
    border:none;
    border-radius:10px;
    padding:10px;
    font-size:14px;
    flex:1;
  }

  #status{
    font-size:13px;
    color: var(--text-dim);
    min-height: 18px;
    margin-top: 6px;
  }
  #status.error{ color: var(--danger); }

  /* ---- カスタム枠パネル ---- */
  .custom-slider-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
    width:100%;
  }
  .custom-slider-label{
    width:44px;
    font-size:13px;
    color: var(--text-dim);
    flex-shrink:0;
  }
  .custom-slider-row input[type="range"]{
    flex:1;
    accent-color: var(--accent);
  }
  .custom-slider-val{
    width:44px;
    text-align:right;
    font-size:13px;
    color: var(--text);
    flex-shrink:0;
  }

  /* ---- サムネイルの並べ替え用コントロール(↑↓×) ---- */
  .thumb .ctrl-bar{
    position:absolute;
    left:0; right:0; bottom:0;
    display:flex;
    gap:4px;
    padding:4px;
    background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.55));
  }
  .thumb .ctrl-bar button{
    flex:1;
    padding:4px 0;
    font-size:13px;
    background: rgba(0,0,0,0.55);
    color:#fff;
    border-radius:6px;
  }
  .thumb .ctrl-bar button:disabled{
    opacity:0.35;
  }
</style>
</head>
<body>

<h1>単語帳スキャナー</h1>
<div class="sub">枠の中を撮ってたまったらPDFにまとめます（枚数の上限はありません）</div>

<div class="panel">
  <div id="cameraWrap">
    <video id="video" autoplay playsinline muted></video>
    <div id="frame" class="size-medium"></div>
    <div id="flash"></div>
    <div id="zoomControl">
      <span id="zoomVal">1.0x</span>
      <input type="range" id="zoomSlider" min="1" max="3" step="0.02" value="1" orient="vertical">
    </div>
    <div id="cameraHint">枠の中に単語を収めてください</div>
  </div>

  <div class="row">
    <button class="btn-toggle" data-size="large">大</button>
    <button class="btn-toggle active" data-size="medium">中</button>
    <button class="btn-toggle" data-size="small">小</button>
    <button class="btn-toggle" data-size="thin">極細</button>
    <button class="btn-toggle" data-size="custom">カスタム</button>
  </div>

  <div class="row" id="orientRow">
    <button class="btn-toggle active" data-orient="horizontal">横向きの枠</button>
    <button class="btn-toggle" data-orient="vertical">縦向きの枠</button>
  </div>

  <!-- 「カスタム」を選んだときだけ表示される、枠のサイズを自分で
       調節するためのパネル。スライダーで横幅・縦幅を直接指定できる。
       普段は非表示(display:none)にしておく -->
  <div class="row" id="customPanel" style="display:none; flex-direction:column;">
    <div class="custom-slider-row">
      <span class="custom-slider-label">横幅</span>
      <input type="range" id="customWidth" min="5" max="100" step="1" value="75">
      <span class="custom-slider-val" id="customWidthVal">75%</span>
    </div>
    <div class="custom-slider-row">
      <span class="custom-slider-label">縦幅</span>
      <input type="range" id="customHeight" min="5" max="100" step="1" value="22">
      <span class="custom-slider-val" id="customHeightVal">22%</span>
    </div>
    <div class="row" style="margin-top:4px;">
      <select id="templateSelect"><option value="">（保存したテンプレートなし）</option></select>
    </div>
    <div class="row">
      <button id="applyTemplateBtn" class="btn-secondary">テンプレートを適用</button>
      <button id="deleteTemplateBtn" class="btn-danger">削除</button>
    </div>
    <div class="row">
      <button id="saveTemplateBtn" class="btn-secondary" style="flex:1">今のカスタム枠をテンプレートとして保存</button>
    </div>
  </div>

  <div class="row">
    <button id="startBtn" class="btn-secondary">カメラを起動</button>
    <button id="flipBtn" class="btn-secondary">カメラ切替</button>
  </div>

  <div class="row">
    <button id="shootBtn" class="btn-main" disabled>撮影する</button>
  </div>

  <div id="status"></div>
</div>

<div class="panel">
  <div id="countLabel">撮影済み：<b id="countNum">0</b>枚</div>
  <div class="row">
    <button id="shuffleBtn" class="btn-secondary" style="flex:1">並び順をランダムにする</button>
  </div>
  <div id="thumbs"></div>
  <div id="emptyNote" class="empty-note">まだ撮影した単語がありません</div>
</div>

<div class="panel">
  <div class="row">
    <select id="pageSize">
      <option value="a4">A4で作る</option>
      <option value="a5">A5で作る</option>
    </select>
    <select id="layoutCols">
      <option value="1">1列（大きく表示）</option>
      <option value="2" selected>2列（たくさん入る）</option>
    </select>
  </div>
  <div class="row">
    <button id="pdfBtn" class="btn-main" disabled>PDFを作成してダウンロード</button>
  </div>
  <div class="row">
    <button id="resetBtn" class="btn-danger" style="flex:1">全部消してやり直す</button>
  </div>
</div>

<!-- PDF作成に使うライブラリは、JS側で複数の読み込み元を
     順番に試すようにしています(下のscript内のensureJsPDF)。
     どこか1つが繋がらなくても他で読み込めるようにするためです。 -->

<script>
/* =========================================================
   単語帳スキャナー本体のスクリプト
   非エンジニアの方でも追いやすいように、なるべく処理ごとに
   コメントを書いています。
   ========================================================= */

/* ---------- PDFライブラリ(jsPDF)の読み込み ----------
   1箇所のCDNだけに頼ると、そこに繋がらないときにPDFが
   作れなくなってしまうため、複数の読み込み元を順番に試す。
   ページを開いた時点でバックグラウンドで読み込みを始めておき、
   「PDFを作成」ボタンを押した瞬間には読み込み済みの状態を
   目指す（ボタンを押した後にawaitで待つと、iOS Safariで
   ダウンロードがブロックされることがあるため）。
*/
function loadScriptOnce(src){
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = src;
    s.onload = ()=> resolve();
    s.onerror = ()=> reject(new Error('読み込み失敗: ' + src));
    document.head.appendChild(s);
  });
}

async function ensureJsPDF(){
  if(window.jspdf && window.jspdf.jsPDF) return true;
  const candidates = [
    'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
    'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',
    'https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js'
  ];
  for(const url of candidates){
    try{
      await loadScriptOnce(url);
      if(window.jspdf && window.jspdf.jsPDF) return true;
    }catch(e){
      console.warn(e);
    }
  }
  return false;
}

// ページを開いたらすぐ先読みしておく
ensureJsPDF();

const video       = document.getElementById('video');
const frameEl     = document.getElementById('frame');
const flashEl     = document.getElementById('flash');
const startBtn    = document.getElementById('startBtn');
const flipBtn     = document.getElementById('flipBtn');
const shootBtn    = document.getElementById('shootBtn');
const pdfBtn      = document.getElementById('pdfBtn');
const resetBtn    = document.getElementById('resetBtn');
const statusEl    = document.getElementById('status');
const thumbsEl    = document.getElementById('thumbs');
const countNumEl  = document.getElementById('countNum');
const emptyNoteEl = document.getElementById('emptyNote');
const pageSizeSel = document.getElementById('pageSize');
const layoutColsSel = document.getElementById('layoutCols');
const zoomSlider  = document.getElementById('zoomSlider');
const zoomValEl   = document.getElementById('zoomVal');
const shuffleBtn  = document.getElementById('shuffleBtn');
const orientRow   = document.getElementById('orientRow');
const customPanel = document.getElementById('customPanel');
const customWidthSlider  = document.getElementById('customWidth');
const customHeightSlider = document.getElementById('customHeight');
const customWidthVal  = document.getElementById('customWidthVal');
const customHeightVal = document.getElementById('customHeightVal');
const templateSelect   = document.getElementById('templateSelect');
const saveTemplateBtn  = document.getElementById('saveTemplateBtn');
const applyTemplateBtn = document.getElementById('applyTemplateBtn');
const deleteTemplateBtn= document.getElementById('deleteTemplateBtn');

// 撮影枚数の上限は撤廃しました（以前は20枚→40枚でしたが、今は無制限です）。
// 撮った画像を貯めておく配列。dataUrlに加えてwidth/heightも
// 撮影した時点でまとめて持っておく（PDF作成時に読み直さないため）
let shots = [];
let currentStream = null;
let facingMode = 'environment'; // 'environment'=背面カメラ, 'user'=内カメラ
let currentTrack = null;
let zoomMode = 'none';   // 'hardware' = 端末のズーム機能, 'css' = 映像を拡大表示

function setStatus(msg, isError=false){
  statusEl.textContent = msg;
  statusEl.className = isError ? 'error' : '';
}

/* ---------- 枠のサイズ切り替え(大/中/小/極細/カスタム) ----------
   「カスタム」を選んだときだけ、下にスライダーのパネルを表示して
   横幅・縦幅を自分で自由に決められるようにしている。
   その場合は「向き(横/縦)」ボタンの意味がなくなるので非表示にする
   （カスタムでは横幅・縦幅を両方直接指定できるため、縦長も横長も
   スライダーだけで作れる） */
document.querySelectorAll('.btn-toggle[data-size]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.btn-toggle[data-size]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');

    if(btn.dataset.size === 'custom'){
      orientRow.style.display = 'none';
      customPanel.style.display = 'flex';
      frameEl.className = 'size-custom';
      applyCustomFrameSize();
    }else{
      orientRow.style.display = '';
      customPanel.style.display = 'none';
      // カスタムで直接指定していたinlineのwidth/heightを解除して、
      // CSSのクラス指定(size-large等)が効くようにする
      frameEl.style.width = '';
      frameEl.style.height = '';
      // vertical(縦向き)のクラスは維持したまま、サイズのクラスだけ入れ替える
      const isVertical = frameEl.classList.contains('vertical');
      frameEl.className = 'size-' + btn.dataset.size + (isVertical ? ' vertical' : '');
    }
  });
});

/* ---------- カスタム枠：スライダーで横幅・縦幅を直接指定 ---------- */
function applyCustomFrameSize(){
  const w = customWidthSlider.value;
  const h = customHeightSlider.value;
  customWidthVal.textContent = w + '%';
  customHeightVal.textContent = h + '%';
  frameEl.style.width = w + '%';
  frameEl.style.height = h + '%';
}
customWidthSlider.addEventListener('input', applyCustomFrameSize);
customHeightSlider.addEventListener('input', applyCustomFrameSize);

/* ---------- テンプレート機能 ----------
   カスタム枠の「横幅・縦幅」の組み合わせに名前を付けて、
   ブラウザの中(localStorage)に保存しておく機能。
   ※ iPadのEdge/Safariなど、同じブラウザ・同じサイト(同じURL)で
   開いたときだけ読み込める点に注意（別の端末やアプリには
   引き継がれません）
*/
const TEMPLATE_KEY = 'wordFrameTemplates';

function loadTemplates(){
  try{
    return JSON.parse(localStorage.getItem(TEMPLATE_KEY)) || [];
  }catch(e){
    return [];
  }
}

function saveTemplatesToStorage(list){
  localStorage.setItem(TEMPLATE_KEY, JSON.stringify(list));
}

function refreshTemplateSelect(){
  const list = loadTemplates();
  templateSelect.innerHTML = '';
  if(list.length === 0){
    const opt = document.createElement('option');
    opt.value = '';
    opt.textContent = '（保存したテンプレートなし）';
    templateSelect.appendChild(opt);
    return;
  }
  list.forEach(t=>{
    const opt = document.createElement('option');
    opt.value = t.name;
    opt.textContent = t.name + '（横' + t.width + '% / 縦' + t.height + '%）';
    templateSelect.appendChild(opt);
  });
}

saveTemplateBtn.addEventListener('click', ()=>{
  const defaultName = '枠 ' + customWidthSlider.value + 'x' + customHeightSlider.value;
  const name = prompt('テンプレート名を入力してください', defaultName);
  if(!name) return; // キャンセルまたは空欄なら何もしない

  const list = loadTemplates();
  const newTemplate = {
    name: name,
    width: parseInt(customWidthSlider.value, 10),
    height: parseInt(customHeightSlider.value, 10)
  };
  // 同じ名前がすでにあれば上書きする
  const existingIdx = list.findIndex(t => t.name === name);
  if(existingIdx >= 0){
    list[existingIdx] = newTemplate;
  }else{
    list.push(newTemplate);
  }
  saveTemplatesToStorage(list);
  refreshTemplateSelect();
  templateSelect.value = name;
  setStatus('テンプレート「' + name + '」を保存しました');
});

applyTemplateBtn.addEventListener('click', ()=>{
  const name = templateSelect.value;
  if(!name){
    setStatus('適用するテンプレートを選んでください', true);
    return;
  }
  const list = loadTemplates();
  const t = list.find(t => t.name === name);
  if(!t) return;
  customWidthSlider.value = t.width;
  customHeightSlider.value = t.height;
  applyCustomFrameSize();
  setStatus('テンプレート「' + name + '」を適用しました');
});

deleteTemplateBtn.addEventListener('click', ()=>{
  const name = templateSelect.value;
  if(!name) return;
  if(!confirm('テンプレート「' + name + '」を削除します。よろしいですか？')) return;
  let list = loadTemplates();
  list = list.filter(t => t.name !== name);
  saveTemplatesToStorage(list);
  refreshTemplateSelect();
  setStatus('テンプレート「' + name + '」を削除しました');
});

refreshTemplateSelect(); // ページを開いた時点で保存済みテンプレート一覧を表示

/* ---------- 枠の向き切り替え(横向き/縦向き) ----------
   縦向きにすると、CSS側で同じサイズの数値の width/height を
   入れ替えたスタイル(#frame.vertical.size-xxx)が適用される */
document.querySelectorAll('.btn-toggle[data-orient]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.btn-toggle[data-orient]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    frameEl.classList.toggle('vertical', btn.dataset.orient === 'vertical');
  });
});

/* ---------- カメラ起動 ---------- */
async function startCamera(){
  setStatus('カメラを起動しています…');
  // すでに映像が出ていたら一旦止める(カメラ切替のときのため)
  if(currentStream){
    currentStream.getTracks().forEach(t=>t.stop());
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode: { ideal: facingMode },
        width:  { ideal: 1920 },
        height: { ideal: 1080 }
      }
    });
    currentStream = stream;
    currentTrack = stream.getVideoTracks()[0];
    video.srcObject = stream;
    shootBtn.disabled = false;
    setupZoom();
    setStatus('');
  }catch(err){
    console.error(err);
    setStatus('カメラを起動できませんでした。ブラウザのカメラ許可設定を確認してください。', true);
  }
}

/* ---------- ズームの準備 ----------
   端末・ブラウザが「ハードウェアズーム」に対応していればそれを使う。
   対応していない場合（iPadのSafariなど多くはこちら）は、
   映像そのものをCSSで拡大表示する「疑似ズーム」に切り替える。
   ※撮影の切り取り計算は画面上の実際の見た目のサイズを元に
     行っているので、どちらの方式でも撮影結果は正しく切り取られる。
*/
function setupZoom(){
  video.style.transform = 'scale(1)'; // 前回の拡大表示をリセット
  zoomSlider.value = 1;
  zoomValEl.textContent = '1.0x';

  const caps = currentTrack.getCapabilities ? currentTrack.getCapabilities() : {};
  if(caps.zoom){
    zoomMode = 'hardware';
    zoomSlider.min = caps.zoom.min;
    zoomSlider.max = caps.zoom.max;
    zoomSlider.step = caps.zoom.step || 0.1;
    zoomSlider.value = caps.zoom.min;
  }else{
    zoomMode = 'css';
    zoomSlider.min = 1;
    zoomSlider.max = 3;
    zoomSlider.step = 0.02;
    zoomSlider.value = 1;
  }
}

zoomSlider.addEventListener('input', ()=>{
  const val = parseFloat(zoomSlider.value);
  zoomValEl.textContent = val.toFixed(1) + 'x';

  if(zoomMode === 'hardware'){
    currentTrack.applyConstraints({ advanced: [{ zoom: val }] }).catch(err=>{
      console.error(err);
      setStatus('ズームの適用に失敗しました', true);
    });
  }else{
    // 映像自体を拡大する疑似ズーム(中心を基準に拡大)
    video.style.transform = 'scale(' + val + ')';
  }
});

startBtn.addEventListener('click', startCamera);

flipBtn.addEventListener('click', ()=>{
  facingMode = (facingMode === 'environment') ? 'user' : 'environment';
  startCamera();
});

/* ---------- 撮影処理 ----------
   ポイント：ネイティブのカメラ機能(input capture等)を使わず、
   映像(video)から直接canvasに描き写しているだけなので
   シャッター音は鳴りません。
*/
shootBtn.addEventListener('click', ()=>{
  if(!video.videoWidth){
    setStatus('カメラの準備がまだできていません。少し待ってから押してください。', true);
    return;
  }

  // 1) 画面上の「枠」と「映像」の位置・大きさ(px)を取得
  const videoRect = video.getBoundingClientRect();
  const frameRect = frameEl.getBoundingClientRect();

  // 2) video要素はCSSで object-fit:cover にしているため、
  //    実際の映像(videoWidth x videoHeight)は画面表示より
  //    拡大されて中央が切り取られた状態で見えている。
  //    その拡大率(scale)とズレ(offset)を計算する。
  const scale = Math.max(
    videoRect.width  / video.videoWidth,
    videoRect.height / video.videoHeight
  );
  const renderedW = video.videoWidth  * scale;
  const renderedH = video.videoHeight * scale;
  const offsetX = (renderedW - videoRect.width)  / 2;
  const offsetY = (renderedH - videoRect.height) / 2;

  // 3) 画面上の枠の位置を「実際の映像の中の座標(px)」に変換
  const frameLeftOnVideo = (frameRect.left - videoRect.left) + offsetX;
  const frameTopOnVideo  = (frameRect.top  - videoRect.top)  + offsetY;

  const srcX = frameLeftOnVideo / scale;
  const srcY = frameTopOnVideo  / scale;
  const srcW = frameRect.width  / scale;
  const srcH = frameRect.height / scale;

  // 4) その部分だけをcanvasに切り取って描画
  const canvas = document.createElement('canvas');
  canvas.width  = Math.round(srcW);
  canvas.height = Math.round(srcH);
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, srcX, srcY, srcW, srcH, 0, 0, canvas.width, canvas.height);

  const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
  // PDF作成時に読み直さなくていいよう、幅と高さもこの時点で保存しておく
  shots.push({ dataUrl: dataUrl, width: canvas.width, height: canvas.height });
  renderThumbs();
  showCaptureSignal();
  setStatus('撮影しました（合計' + shots.length + '枚）');
});

/* ---------- 撮れたことを知らせる合図 ----------
   音を鳴らさない方針なので、代わりに
   ・画面を一瞬白く光らせる
   ・枠を一瞬白くする
   ・対応端末なら軽く振動させる(navigator.vibrate。音ではないのでシャッター音の
     方針とは矛盾しない。対応していない端末では単に何も起きないだけ)
   の3つで「撮れたこと」がわかるようにしている。
*/
function showCaptureSignal(){
  // クラスを一度外してから付け直すことで、連続撮影時にもアニメーションを
  // 毎回最初から再生できるようにしている
  flashEl.classList.remove('active');
  frameEl.classList.remove('captured');
  void flashEl.offsetWidth; // 強制的に再描画させるおまじない
  flashEl.classList.add('active');
  frameEl.classList.add('captured');

  setTimeout(()=>{
    frameEl.classList.remove('captured');
  }, 280);

  if(navigator.vibrate){
    navigator.vibrate(60);
  }
}

/* ---------- サムネイル表示 ---------- */
function renderThumbs(){
  thumbsEl.innerHTML = '';
  emptyNoteEl.style.display = shots.length ? 'none' : 'block';

  shots.forEach((shot, idx)=>{
    const box = document.createElement('div');
    box.className = 'thumb';

    const img = document.createElement('img');
    img.src = shot.dataUrl;
    box.appendChild(img);

    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '×';
    del.addEventListener('click', ()=>{
      shots.splice(idx,1);
      renderThumbs();
    });
    box.appendChild(del);

    // ---- 並べ替え用の「↑」「↓」ボタン ----
    // 押すと、配列shotsの中で自分の位置を1つ前/後ろの画像と入れ替える。
    // 一番上の画像には↑、一番下の画像には↓を無効(disabled)にしている
    const ctrlBar = document.createElement('div');
    ctrlBar.className = 'ctrl-bar';

    const upBtn = document.createElement('button');
    upBtn.textContent = '↑';
    upBtn.disabled = (idx === 0);
    upBtn.addEventListener('click', ()=>{
      if(idx === 0) return;
      [shots[idx-1], shots[idx]] = [shots[idx], shots[idx-1]];
      renderThumbs();
    });
    ctrlBar.appendChild(upBtn);

    const downBtn = document.createElement('button');
    downBtn.textContent = '↓';
    downBtn.disabled = (idx === shots.length - 1);
    downBtn.addEventListener('click', ()=>{
      if(idx === shots.length - 1) return;
      [shots[idx+1], shots[idx]] = [shots[idx], shots[idx+1]];
      renderThumbs();
    });
    ctrlBar.appendChild(downBtn);

    box.appendChild(ctrlBar);

    thumbsEl.appendChild(box);
  });

  countNumEl.textContent = shots.length;
  shootBtn.disabled = !currentStream; // 撮影枚数の上限は撤廃したので、カメラが起動していれば撮影可能
  pdfBtn.disabled = shots.length === 0;
}

/* ---------- 並び順をランダムにする ----------
   Fisher-Yatesシャッフルという定番のやり方で、配列の中身を
   偏りなくランダムに並べ替えている */
shuffleBtn.addEventListener('click', ()=>{
  if(shots.length < 2) return;
  for(let i = shots.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [shots[i], shots[j]] = [shots[j], shots[i]];
  }
  renderThumbs();
  setStatus('並び順をランダムにしました');
});

/* ---------- 全部リセット ---------- */
resetBtn.addEventListener('click', ()=>{
  if(shots.length === 0) return;
  if(confirm('撮影した' + shots.length + '枚をすべて削除します。よろしいですか？')){
    shots = [];
    renderThumbs();
    setStatus('リセットしました');
  }
});

/* ---------- PDF作成 ----------
   横長の単語カードを、ページの上から下へ順番に並べていきます。
   入りきらなくなったら自動で次のページに移ります。
*/
pdfBtn.addEventListener('click', ()=>{
  if(shots.length === 0) return;

  // jsPDFがまだ読み込めていない場合は、ここで待たずに
  // (待つとiOSでダウンロードがブロックされる可能性があるため)
  // エラーを伝えて裏で再読み込みを試みる。もう一度ボタンを
  // 押してもらえば、大抵は読み込みが間に合っている。
  if(!(window.jspdf && window.jspdf.jsPDF)){
    setStatus('PDF機能の読み込みに失敗しました。電波の良い場所でもう一度「PDFを作成」を押してみてください。', true);
    ensureJsPDF();
    return;
  }

  // 前に途中まで動いて固まっていた原因：処理の途中でawait(非同期の待ち)が
  // 入っていたため、iOSのSafariが「ボタンを押した操作の続き」とみなさなくなり、
  // 最後のダウンロードがブロックされていた可能性が高い。
  // → 画像のサイズは撮影時に保存済みなので、ここでは一切待たずに
  //    全部その場で(同期処理で)完結させる。

  pdfBtn.disabled = true;
  setStatus('PDFを作成しています…');

  try{
    const { jsPDF } = window.jspdf;
    const size = pageSizeSel.value; // 'a4' or 'a5'
    const doc = new jsPDF({
      orientation: 'portrait',
      unit: 'mm',
      format: size
    });

    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const margin = 8;        // 外側の余白(mm)。詰めて1枚により多く入るようにしている
    const gap = 3;            // 縦方向のカード同士の間隔(mm)
    const columnGap = 4;      // 2列にしたときの左右の間隔(mm)
    const columns = parseInt(layoutColsSel.value, 10) || 1;

    const usableW = pageW - margin*2;
    const colW = columns === 2 ? (usableW - columnGap) / 2 : usableW;

    let cursorY = margin;

    // shotsをcolumns個ずつの「行」に分けて、行ごとに高さをそろえて並べる
    for(let i=0; i<shots.length; i += columns){
      const rowItems = shots.slice(i, i + columns);
      const rowHeights = rowItems.map(s => colW * (s.height / s.width));
      const rowH = Math.max(...rowHeights);

      // ページに入りきらなければ新しいページへ
      if(cursorY + rowH > pageH - margin){
        doc.addPage();
        cursorY = margin;
      }

      rowItems.forEach((shot, idx)=>{
        const x = margin + idx * (colW + columnGap);
        const h = colW * (shot.height / shot.width);
        doc.addImage(shot.dataUrl, 'JPEG', x, cursorY, colW, h);
      });

      cursorY += rowH + gap;
    }

    doc.save('単語帳.pdf');
    setStatus('PDFをダウンロードしました');
  }catch(err){
    console.error(err);
    setStatus('PDFの作成に失敗しました：' + err.message, true);
  }finally{
    pdfBtn.disabled = false;
  }
});

/* 初期状態の見た目を整える */
renderThumbs();
</script>
</body>
</html>
